[project]
name = "backend"
version = "0.1.0"
description = "Django API for weather-aware truck routing"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["\\.venv/"]

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["E501", "RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "djangorestframework-stubs[compatible-mypy]>=3.18.1",
    "mypy>=2.3.1",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]
